[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "IATheory"
version = "0.0.1"
description = "Model correlations from lightcone and boxes for intrinsic alignment analysis."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "D. Navarro-Gironés, A. Herle, echoIA, IA Euclid group", email = "david.navarro.girones@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "astropy",
  "pandas",
  "pyccl>=3.0",
  "fast-pt>=3.0",
  "pytest",
]

[project.optional-dependencies]
# Core package only. Install with:  pip install -e ".[examples]"
examples = [
  "matplotlib",
  "jupyter",
  "ipykernel",
  "requests",
  "camb",
]
# Likelihood / sampling examples.  pip install -e ".[likelihood]"
likelihood = [
  "emcee",
  "nautilus-sampler",
]
dev = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/DavidNavarroG/IATheory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
